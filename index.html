<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Λαχανικά Κύπρου | Hort Guide</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --accent: #2ecc71;
  --accent2: #27ae60;
  --text: #e8f0e8;
  --muted: #8fa3b0;
  --border: #2a3a4a;
  --danger: #e74c3c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  line-height: 1.4;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(180deg, #0f1419 90%, transparent);
  padding: 12px 16px 8px;
}
h1 {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: -0.3px;
}
.search-box {
  position: relative;
}
#search {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 2px solid var(--border);
  border-radius: 14px;
  background: var(--card);
  color: var(--text);
  font-size: 16px; /* prevents zoom on iOS */
  outline: none;
  transition: border-color 0.2s;
}
#search:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 18px;
  pointer-events: none;
}
.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 16px 6px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.chip.active {
  background: var(--accent);
  color: #0f1419;
  border-color: var(--accent);
}
.stats {
  display: flex;
  gap: 12px;
  padding: 4px 16px 8px;
  font-size: 12px;
  color: var(--muted);
  align-items: center;
  flex-wrap: wrap;
}
.stats span { color: var(--accent); font-weight: 600; }
.sort-box {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}
#sort {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  outline: none;
  max-width: 140px;
}
#sort:focus { border-color: var(--accent); }
main {
  padding: 0 12px 20px;
}
.card {
  background: var(--card);
  border-radius: 16px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
  transition: transform 0.15s;
}
.card:active { transform: scale(0.985); }
.card-header {
  padding: 14px 16px 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.crop-name {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
}
.badge {
  background: rgba(46, 204, 113, 0.15);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 8px;
  white-space: nowrap;
}
.card-body {
  padding: 0 16px 14px;
}
.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 12px;
  margin-top: 8px;
}
.label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.value {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text);
}
.full { grid-column: 1 / -1; }
.varieties {
  font-size: 12.5px;
  color: #a8c5b0;
  line-height: 1.35;
}
.period {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(46, 204, 113, 0.12);
  color: var(--accent);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty svg { margin-bottom: 12px; opacity: 0.4; }
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--muted);
  z-index: 50;
}
.source { color: var(--accent); }
.highlight { background: rgba(46,204,113,0.25); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>🌿 Λαχανικά Κύπρου</h1>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="search" id="search" placeholder="Αναζήτηση είδους ή ποικιλίας..." autocomplete="off" enterkeyhint="search">
  </div>
</header>

<div class="filters" id="filters">
  <button class="chip active" data-filter="all">Όλα</button>
  <button class="chip" data-filter="greenhouse">Θερμοκήπιο</button>
  <button class="chip" data-filter="field">Χωράφι</button>
  <button class="chip" data-filter="leafy">Φυλλώδη</button>
  <button class="chip" data-filter="root">Ριζώδη</button>
  <button class="chip" data-filter="fruit">Καρποφόρα</button>
</div>

<div class="stats">
  <div>Είδη: <span id="count">0</span></div>
  <div>Εμφάνιση: <span id="shown">0</span></div>
  <div class="sort-box">
    <label for="sort">Σορτ:</label>
    <select id="sort">
      <option value="sow-asc" selected>Σπορά (νωρίς→αργά)</option>
      <option value="sow-desc">Σπορά (αργά→νωρίς)</option>
      <option value="harvest-asc">Συγκομιδή (νωρίς→αργά)</option>
      <option value="harvest-desc">Συγκομιδή (αργά→νωρίς)</option>
      <option value="name-asc">Α → Ω</option>
      <option value="name-desc">Ω → Α</option>
      <option value="yield-desc">Απόδοση ↓</option>
      <option value="yield-asc">Απόδοση ↑</option>
    </select>
  </div>
</div>

<main id="list"></main>

<footer>
  <span>MOA Cyprus Data</span>
  <span class="source">Χρήσιμα στοιχεία καλλιέργειας</span>
</footer>

  {name:"Ραδίκι", varieties:"ντόπια ποικιλία", sow:"Αύγουστος-Μάρτιος", days:10, depth:"1-2", transplant:"Σεπτέμβριος-Μάρτιος", rows:"30-45", plants:"15-22", seed:"50-100g", density:"-", harvest:"Νοέμβριος-Μάιος", yield:"10.000-12.000 δέσμες", life:5, seedsg:"850", tags:["leafy","field"]},
  {name:"Ρεπάνι", varieties:"Champion, Red Hazera, Gloriette, Varda, Gigantec Siculo", sow:"Ολόχρονα", days:5, depth:"1-2", transplant:"-", rows:"10-22", plants:"4-7", seed:"2-2,5kg", density:"-", harvest:"Ολόχρονα", yield:"10.000 δέσμες", life:"4-5", seedsg:"110", tags:["root","field"]},
  {name:"Ρόκα", varieties:"ντόπια ποικιλία, Rocket salad", sow:"Ιούλιος-Φεβρουάριος", days:10, depth:"1-2", transplant:"-", rows:"15-45", plants:"8-30", seed:"300-500g", density:"-", harvest:"Σεπτέμβριος-Απρίλιος", yield:"12.000 δέσμες", life:"4-5", seedsg:"-", tags:["leafy","field"]}
];

const list = document.getElementById('list');
const searchEl = document.getElementById('search');
const sortEl = document.getElementById('sort');
const countEl = document.getElementById('count');
const shownEl = document.getElementById('shown');
let activeFilter = 'all';

countEl.textContent = DATA.length;

// Accent-free month map
const MONTHS = [
  ['ιανουαριος',1],['ιαν',1],['φεβρουαριος',2],['φεβ',2],
  ['μαρτιος',3],['μαρ',3],['απριλιος',4],['απρ',4],
  ['μαιος',5],['μαι',5],['ιουνιος',6],['ιουν',6],
  ['ιουλιος',7],['ιουλ',7],['αυγουστος',8],['αυγ',8],
  ['σεπτεμβριος',9],['σεπ',9],['οκτωβριος',10],['οκτ',10],
  ['νοεμβριος',11],['νοε',11],['δεκεμβριος',12],['δεκ',12]
];

function stripAccents(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function parseYield(y) {
  if (!y || y === '-') return 0;
  const m = String(y).replace(/\./g,'').match(/(\d+)/);
  return m ? parseInt(m[1],10) : 0;
}

// Earliest month: 1-12, 0=ολόχρονα, 99=unknown
function parseMonth(str) {
  if (!str || str === '-' || str === '—') return 99;
  const s = stripAccents(str);
  if (s.includes('ολοχρονα')) return 0;
  let best = 99;
  for (const [name, num] of MONTHS) {
    if (s.includes(name) && num < best) best = num;
  }
  return best;
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function render(items, q = '') {
  shownEl.textContent = items.length;
  if (!items.length) {
    list.innerHTML = `<div class="empty"><div style="font-size:48px">🌱</div><div>Δεν βρέθηκαν αποτελέσματα</div></div>`;
    return;
  }
  list.innerHTML = items.map(d => `
    <article class="card">
      <div class="card-header">
        <div class="crop-name">${highlight(d.name, q)}</div>
        <div class="badge">${d.harvest.includes('Ολόχρονα') ? 'Ολόχρονα' : d.harvest.split('-')[0]}</div>
      </div>
      <div class="card-body">
        <div class="full">
          <div class="label">Κυριότερες ποικιλίες</div>
          <div class="varieties">${highlight(d.varieties, q)}</div>
        </div>
        <div class="row">
          <div>
            <div class="label">Σπορά / Φύτευση</div>
            <div class="value period">${d.sow || '—'}</div>
          </div>
          <div>
            <div class="label">Συγκομιδή</div>
            <div class="value period">${d.harvest || '—'}</div>
          </div>
          <div>
            <div class="label">Μεταξύ γραμμών (cm)</div>
            <div class="value">${d.rows || '—'}</div>
          </div>
          <div>
            <div class="label">Μεταξύ φυτών (cm)</div>
            <div class="value">${d.plants || '—'}</div>
          </div>
          <div>
            <div class="label">Σπόρος / δεκάριο</div>
            <div class="value">${d.seed || '—'}</div>
          </div>
          <div>
            <div class="label">Φυτά / δεκάριο</div>
            <div class="value">${d.density || '—'}</div>
          </div>
          <div>
            <div class="label">Απόδοση / δεκάριο</div>
            <div class="value">${d.yield || '—'}</div>
          </div>
          <div>
            <div class="label">Βάθος σποράς (cm)</div>
            <div class="value">${d.depth || '—'}</div>
          </div>
        </div>
      </div>
    </article>
  `).join('');
}

function filterData() {
  const q = searchEl.value.trim().toLowerCase();
  let filtered = [...DATA];
  if (activeFilter !== 'all') {
    filtered = filtered.filter(d => d.tags.includes(activeFilter));
  }
  if (q) {
    filtered = filtered.filter(d =>
      d.name.toLowerCase().includes(q) ||
      d.varieties.toLowerCase().includes(q) ||
      d.sow.toLowerCase().includes(q) ||
      d.harvest.toLowerCase().includes(q)
    );
  }

  // SORT (use transplant if sow missing)
  const sortVal = sortEl.value;
  const sowKey = d => {
    const m = parseMonth(d.sow);
    return m === 99 ? parseMonth(d.transplant) : m;
  };
  filtered.sort((a, b) => {
    if (sortVal === 'sow-asc') return sowKey(a) - sowKey(b) || a.name.localeCompare(b.name,'el');
    if (sortVal === 'sow-desc') return sowKey(b) - sowKey(a) || a.name.localeCompare(b.name,'el');
    if (sortVal === 'harvest-asc') return parseMonth(a.harvest) - parseMonth(b.harvest) || a.name.localeCompare(b.name,'el');
    if (sortVal === 'harvest-desc') return parseMonth(b.harvest) - parseMonth(a.harvest) || a.name.localeCompare(b.name,'el');
    if (sortVal === 'name-asc') return a.name.localeCompare(b.name, 'el');
    if (sortVal === 'name-desc') return b.name.localeCompare(a.name, 'el');
    if (sortVal === 'yield-desc') return parseYield(b.yield) - parseYield(a.yield);
    if (sortVal === 'yield-asc') return parseYield(a.yield) - parseYield(b.yield);
    return 0;
  });

  render(filtered, q);
}

searchEl.addEventListener('input', filterData);
searchEl.addEventListener('search', filterData);
sortEl.addEventListener('change', filterData);

document.getElementById('filters').addEventListener('click', e => {
  if (!e.target.classList.contains('chip')) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  activeFilter = e.target.dataset.filter;
  filterData();
});

// Initial render
filterData();

// Keyboard focus polish
searchEl.addEventListener('focus', () => {
  setTimeout(() => window.scrollTo(0, 0), 100);
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
